:root{--ink:#231F20;--green:#39B54A;--white:#fff;--muted:#BDB8B9;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%;background:var(--ink);color:var(--white);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 0 28px}

/* lanyard */
.strap{width:calc(var(--bw)*.17);height:max(36px,9svh);background:var(--green);
  position:relative;overflow:hidden;display:flex;justify-content:center;align-items:flex-end}
.strap span{writing-mode:vertical-rl;transform:rotate(180deg);font:900 calc(var(--bw)*.055)/1 Nexa,sans-serif;color:var(--ink);letter-spacing:.06em;white-space:nowrap;padding-bottom:calc(var(--bw)*.06)}
.clip{width:calc(var(--bw)*.13);height:calc(var(--bw)*.11);background:#8d8a8b;border:calc(var(--bw)*.012) solid #6f6c6d;border-top:0;position:relative;z-index:3;margin-bottom:calc(var(--bw)*-.07)}
.clip::after{content:"";position:absolute;left:50%;bottom:-.55em;width:.5em;height:1em;transform:translateX(-50%);border:calc(var(--bw)*.012) solid #6f6c6d;border-top:0;border-radius:0 0 1em 1em;font-size:calc(var(--bw)*.1)}

/* badge */
.badge{--bw:inherit;width:var(--bw);container-type:inline-size;background:var(--white);color:var(--ink);position:relative;transform-origin:50% -12%;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.band{background:var(--green);height:25cqw;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 6cqw 4.2cqw}
.slot{position:absolute;top:4.5cqw;left:50%;width:22cqw;height:3.6cqw;background:var(--ink);border-radius:2cqw;transform:translateX(-50%)}
.band img{height:9.5cqw;display:block}
.band .est{font:800 3.1cqw/1.15 Montserrat,sans-serif;text-align:right;letter-spacing:.04em;text-transform:uppercase}
.photo{display:block;width:100%;aspect-ratio:900/594;object-fit:cover;background:#ccc}
.who{padding:0 6cqw;margin-top:-7.5cqw;position:relative}
.who .ln{display:block;font-family:Nexa,"Arial Black",sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.86;white-space:nowrap;overflow:hidden}
.who .first{background:var(--white);display:inline-block;padding:2.4cqw 2.6cqw 0 0}
.who .last{display:inline-block;background:var(--green);padding:1.6cqw 2.6cqw 0;margin-left:-2.6cqw}
.who .ln i{display:inline-block;font-style:normal}
.role{font:700 3.9cqw/1.3 Montserrat,sans-serif;padding:3.4cqw 6cqw 0;max-width:92cqw;min-height:13.6cqw}
.role b{display:block;font-weight:800;font-size:2.9cqw;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.8cqw}
.foot{margin-top:5cqw;background:var(--ink);color:var(--white);display:grid;grid-template-columns:44cqw 1fr;gap:5cqw;padding:5cqw 6cqw 5.5cqw;align-items:stretch}
.qr{background:var(--white);padding:3.6cqw;display:block;border:0;cursor:zoom-in;line-height:0}
.qr svg{width:100%;height:auto;display:block}
.cta{display:flex;flex-direction:column;justify-content:space-between}
.cta h2{font:900 6.6cqw/.9 Nexa,sans-serif;text-transform:uppercase;letter-spacing:-.02em}
.cta h2 em{font-style:normal;color:var(--green)}
.cta p{font:700 3.4cqw/1.35 Montserrat,sans-serif;color:var(--white)}
.tag{display:flex;gap:1.6cqw;align-items:stretch;height:5cqw}
.tag .sw{width:5cqw;background:var(--green)}
.tag .bars{flex:1;background:repeating-linear-gradient(90deg,var(--white) 0 .5cqw,transparent .5cqw 1.2cqw,var(--white) 1.2cqw 1.5cqw,transparent 1.5cqw 2.3cqw)}

/* actions */
.actions{width:var(--bw);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.actions button,.actions a{font:800 14px/1 Montserrat,sans-serif;letter-spacing:.02em;padding:15px 10px;border:2px solid var(--white);background:none;color:var(--white);text-align:center;text-decoration:none;cursor:pointer}
.actions .pri{background:var(--green);border-color:var(--green);color:var(--ink)}
.note{width:var(--bw);margin-top:12px;font:500 13px/1.45 Montserrat,sans-serif;color:var(--muted)}

/* fullscreen qr */
.full{position:fixed;inset:0;background:var(--white);color:var(--ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:20;padding:24px}
.full.on{display:flex}
.full svg{width:min(86vw,62vh);height:auto}
.full p{font:900 26px/1 Nexa,sans-serif;text-transform:uppercase;text-align:center}
.full small{font:700 14px/1.3 Montserrat,sans-serif}

/* index */
.index{width:min(92vw,420px);padding:48px 0}
.index img{height:44px;filter:invert(1);margin-bottom:28px}
.index h1{font:900 44px/.9 Nexa,sans-serif;text-transform:uppercase;letter-spacing:-.03em;margin-bottom:28px}
.index a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--white);text-decoration:none;border-top:2px solid var(--white);padding:16px 0}
.index a b{font:900 24px/1 Nexa,sans-serif;text-transform:uppercase}
.index a span{font:700 13px/1.3 Montserrat,sans-serif;color:var(--muted);text-align:right}
.index a:hover b{color:var(--green)}

/* motion */
@media (prefers-reduced-motion:no-preference){
 .go .badge{animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
 .go .strap{animation:strap .5s ease-out both}
 .go .ln i{animation:rise .6s cubic-bezier(.2,.9,.2,1) both}
 .go .last{animation:wipe .55s cubic-bezier(.7,0,.2,1) .45s both}
 .go .last i{animation-delay:.62s}
 .go .first i{animation-delay:.38s}
 .go .role,.go .foot{animation:fade .5s ease-out .8s both}
}
@keyframes drop{0%{transform:translateY(-60px) rotate(-4deg);opacity:0}55%{opacity:1;transform:translateY(6px) rotate(1.6deg)}80%{transform:translateY(-2px) rotate(-.6deg)}100%{transform:none}}
@keyframes strap{from{transform:translateY(-100%)}to{transform:none}}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.still .actions,.still .note{display:none}
.still .stage{justify-content:center;padding:0 0 4svh}
.still .strap{height:max(36px,7svh)}
</style>
</head>
<body>

function vcard(p,withPhoto){
  const L=["BEGIN:VCARD","VERSION:3.0",`N:${p.last};${p.first};;;`,`FN:${p.first} ${p.last}`,`ORG:${COMPANY.org}`,`TITLE:${p.role}`,
    `TEL;TYPE=WORK,VOICE:${p.phone||COMPANY.phone}`,`TEL;TYPE=MAIN:${COMPANY.phone}`,`EMAIL;TYPE=WORK:${p.email}`,`URL:${COMPANY.web}`,
    `ADR;TYPE=WORK:;;${COMPANY.street};${COMPANY.city};${COMPANY.prov};;${COMPANY.country}`];
  if(withPhoto&&p.vphoto) L.push("PHOTO;ENCODING=b;TYPE=JPEG:"+p.vphoto);
  L.push("END:VCARD");return L.join("\r\n");
}
function qrSvg(text){
  const q=qrcode(0,"M");q.addData(unescape(encodeURIComponent(text)));q.make();
  const n=q.getModuleCount();let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}" fill="#231F20"/></svg>`;
}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function fitName(el){
  /* one name size for the whole team, so the set reads as a system */
  const box=el.querySelector(".who"), lines=[...box.querySelectorAll(".ln")];
  const cs=getComputedStyle(box), target=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const m=document.createElement("span");m.className="ln";m.style.cssText="position:absolute;visibility:hidden;font-size:100px";
  box.appendChild(m);let widest=0;
  ORDER.forEach(k=>["first","last"].forEach(f=>{m.textContent=TEAM[k][f];widest=Math.max(widest,m.getBoundingClientRect().width)}));
  m.remove();
  const pad=parseFloat(getComputedStyle(lines[1]).paddingLeft);
  const size=Math.min(100*(target-pad*1.2)/widest, box.clientWidth*0.2);
  lines.forEach(l=>l.style.fontSize=size+"px");
}
function badge(key){
  const p={...TEAM[key],vphoto:VPHOTO[key]};
  const app=document.getElementById("app");
  const still=new URLSearchParams(location.search).has("still");
  document.body.classList.toggle("still",still);
  document.title=`${p.first} ${p.last} | The MARC Group`;
  app.innerHTML=`
   <div class="strap" aria-hidden="true"><span>MARC &nbsp;·&nbsp; MARC &nbsp;·&nbsp; MARC &nbsp;·&nbsp; MARC &nbsp;·&nbsp; MARC &nbsp;·&nbsp; MARC</span></div>
   <div class="clip" aria-hidden="true"></div>
   <article class="badge" aria-label="${esc(p.first+" "+p.last)}, ${esc(p.role)}">
     <div class="band"><span class="slot"></span><img src="${LOGO}" alt="The MARC Group"><span class="est">Est.<br>2012</span></div>
     <img class="photo" src="data:image/jpeg;base64,${PHOTO[key]}" alt="${esc(p.first)} ${esc(p.last)}">
     <div class="who"><span class="ln first"><i>${esc(p.first)}</i></span><span class="ln last"><i>${esc(p.last)}</i></span></div>
     <p class="role"><b>${esc(p.team||"Executive team")}</b>${esc(p.role)}</p>
     <div class="foot">
       <button class="qr" id="qrbtn" aria-label="Show QR code full screen">${qrSvg(vcard(p,false))}</button>
       <div class="cta"><h2>Scan to<br><em>save</em><br>contact</h2><p>${p.phoneShow||COMPANY.phoneShow}<br>themarcgroupinc.com</p><div class="tag" aria-hidden="true"><span class="sw"></span><span class="bars"></span></div></div>
     </div>
   </article>
   <div class="actions"><button class="pri" id="share">Share / AirDrop</button><button id="save">Save contact</button></div>
   <p class="note">Tap the QR to fill the screen. Turn brightness up for faster scans.</p>`;
  const b=app.querySelector(".badge");
  const run=()=>{fitName(app);if(!still){app.classList.remove("go");void app.offsetWidth;app.classList.add("go");}};
  document.fonts.ready.then(run);
  const full=document.getElementById("full");
  app.querySelector("#qrbtn").onclick=()=>{full.innerHTML=qrSvg(vcard(p,false))+`<p>${esc(p.first)} ${esc(p.last)}</p><small>Tap anywhere to close</small>`;full.classList.add("on")};
  full.onclick=()=>full.classList.remove("on");
  const file=()=>new File([vcard(p,true)],`${p.first}-${p.last}.vcf`,{type:"text/vcard"});
  const dl=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(file());a.download=file().name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  app.querySelector("#save").onclick=dl;
  app.querySelector("#share").onclick=async()=>{const f=file();
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:`${p.first} ${p.last}`})}catch(e){}} else dl();};
}
function index(){
  document.body.classList.remove("still");
  document.getElementById("app").innerHTML=`<div class="index"><img src="${LOGO}" alt="The MARC Group"><h1>Team<br>badges</h1>
   ${ORDER.map(k=>`<a href="#${k}"><b>${TEAM[k].first} ${TEAM[k].last}</b><span>${esc(TEAM[k].role)}</span></a>`).join("")}</div>`;
}
function route(){const k=location.hash.slice(1).toLowerCase();TEAM[k]?badge(k):index()}
function size(){const vw=innerWidth,vh=innerHeight;
  const bw=Math.min(vw*0.88,(vh*0.91-56)/1.9,420);document.documentElement.style.setProperty("--bw",Math.max(bw,280)+"px");}
addEventListener("hashchange",route);addEventListener("resize",()=>{size();const a=document.getElementById("app");if(a.querySelector(".who"))fitName(a)});
size();route();
</script>
</body>
